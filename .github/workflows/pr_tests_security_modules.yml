# Run the security_modules acceptance suite on Pull Requests
# ------------------------------------------------------------------------------
#             NOTICE: **This file is NOT maintained with puppetsync**
#
# It deliberately lives outside pr_tests.yml, which is overwritten wholesale by
# the next puppetsync baseline run. Adding this suite there -- as a matrix
# dimension, a second job, or a reusable-workflow `uses:` -- would be reverted
# by that sync, taking the coverage with it. GitHub discovers every workflow in
# this directory on its own, so a standalone file with its own `pull_request`
# trigger needs no registration anywhere else and survives the sync untouched.
#
# The setup steps below duplicate the ones in pr_tests.yml's `acceptance` job.
# That duplication is the cost of staying out of the synced file: a baseline
# change to the ruby version, the libvirt packages or the action versions will
# land there and NOT here, so keep them in step by hand until this suite is
# added to the pupmod baseline in simp/gha-workflows -- at which point delete
# this file rather than maintaining it.
#
# ==============================================================================
---
name: PR Tests (security_modules)
'on':
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  acceptance-security-modules:
    runs-on:
      - ubuntu-latest
    strategy:
      matrix:
        node:
          - almalinux8
          - almalinux9
          - almalinux10
      fail-fast: false
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9
      - name: bundle install
        run: |
          bundle install
      - name: Setup libvirt for Vagrant
        run: |
          sudo add-apt-repository ppa:evgeni/vagrant
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends vagrant vagrant-libvirt libvirt-daemon-system libvirt-daemon qemu-system-x86 qemu-utils dnsmasq
          sudo chmod 666 /var/run/libvirt/libvirt-sock
      - name: beaker
        env:
          BEAKER_HYPERVISOR: 'vagrant_libvirt'
          VAGRANT_DEFAULT_PROVIDER: 'libvirt'
        run: |
          bundle exec rake beaker:suites[security_modules,${{ matrix.node }}]
